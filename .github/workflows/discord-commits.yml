name: Discord — notify on push

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send commits to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skip."
            exit 0
          fi

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          COMPARE="${{ github.event.compare }}"
          SHA="${{ github.sha }}"

          # Build commit list from the push payload (fallback: last commit message)
          COMMITS=$(python3 - <<'PY'
          import json, os, textwrap
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          lines = []
          if event_path and os.path.isfile(event_path):
              with open(event_path) as f:
                  data = json.load(f)
              for c in data.get("commits") or []:
                  msg = (c.get("message") or "").split("\n")[0][:120]
                  author = (c.get("author") or {}).get("name") or "unknown"
                  url = c.get("url") or ""
                  short = (c.get("id") or "")[:7]
                  lines.append(f"• [`{short}`]({url}) {msg} — *{author}*")
          if not lines:
              lines.append(f"• push by {os.environ.get('ACTOR','')}")
          print("\n".join(lines[:15]))
          PY
          )

          COUNT=$(echo "$COMMITS" | wc -l)
          CONTENT="**Foxurrent.** repo update"

          python3 - <<PY
          import json, os, urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]
          commits = """$COMMITS"""
          payload = {
            "username": "Foxurrent GitHub",
            "avatar_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
            "embeds": [{
              "title": f"Push to `{os.environ.get('BRANCH','')}`",
              "url": os.environ.get("COMPARE") or f"https://github.com/{os.environ.get('REPO','')}",
              "description": commits,
              "color": 0x2b2d31,
              "footer": {"text": f"{os.environ.get('REPO','')} · by {os.environ.get('ACTOR','')}"},
            }]
          }
          req = urllib.request.Request(
            webhook,
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
          )
          with urllib.request.urlopen(req) as resp:
            print("Discord status", resp.status)
          PY
